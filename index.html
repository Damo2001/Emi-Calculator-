<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

h2 {
    text-align: center;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, select, button {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    box-sizing: border-box;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    margin-top: 20px;
    background: #1976d2;
    color: white;
    border: none;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    padding: 15px;
    background: #eeeeee;
    border-radius: 10px;
}

.result p {
    font-size: 17px;
    margin: 10px 0;
}
</style>
</head>

<body>

<div class="container">

<h2>EMI Calculator</h2>

<label>Loan Amount (₹)</label>
<input type="number" id="amount" placeholder="Example: 200000">

<label>Interest Rate (% per year)</label>
<input type="number" id="rate" step="0.01" placeholder="Example: 18">

<label>Loan Tenure (Months)</label>
<input type="number" id="months" placeholder="Example: 24">

<button onclick="calculateEMI()">Calculate EMI</button>

<div class="result">
<p>Monthly EMI: ₹<span id="emi">0</span></p>
<p>Total Interest: ₹<span id="interest">0</span></p>
<p>Total Amount: ₹<span id="total">0</span></p>
</div>

</div>

<script>
function calculateEMI() {

    let P = parseFloat(document.getElementById("amount").value);
    let annualRate = parseFloat(document.getElementById("rate").value);
    let N = parseInt(document.getElementById("months").value);

    if (!P || !annualRate || !N) {
        alert("Please enter all details");
        return;
    }

    let r = annualRate / 12 / 100;

    let EMI;

    if (r === 0) {
        EMI = P / N;
    } else {
        EMI = P * r * Math.pow(1 + r, N) /
              (Math.pow(1 + r, N) - 1);
    }

    let totalAmount = EMI * N;
    let totalInterest = totalAmount - P;

    document.getElementById("emi").innerText =
        EMI.toFixed(2);

    document.getElementById("interest").innerText =
        totalInterest.toFixed(2);

    document.getElementById("total").innerText =
        totalAmount.toFixed(2);
}
</script>

</body>
  </html>
