<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Calculator</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f8fb;
  color:#17324d;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

h1{
  text-align:center;
  color:#0b5cab;
  margin:8px 0 4px;
}

.sub{
  text-align:center;
  color:#607d8b;
  margin-bottom:20px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin:16px 0;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  color:#087f5b;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid #c9d6df;
  border-radius:10px;
  font-size:17px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin:10px 6px 0 0;
}

.calc{
  background:#0b7a5a;
  color:#fff;
}

.reset{
  background:#607d8b;
  color:#fff;
}

.result{
  background:#eef8f4;
  border-left:5px solid #087f5b;
  padding:15px;
  border-radius:10px;
  margin-top:18px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.value{
  font-size:21px;
  font-weight:bold;
  color:#0b5cab;
}

.small{
  font-size:13px;
  color:#607d8b;
}

@media(max-width:600px){
  .row{
    grid-template-columns:1fr;
  }

  .container{
    padding:10px;
  }

  .card{
    padding:16px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>Finance Calculator</h1>

<div class="sub">
  EMI • Reverse EMI • Interest Calculator
</div>


<!-- EMI CALCULATOR -->

<div class="card">

<h2>EMI Calculator</h2>

<label>Loan Amount (₹)</label>
<input
  id="loan"
  type="number"
  min="0"
  placeholder="Example: 200000"
>

<label>Monthly EMI (₹)</label>
<input
  id="emi"
  type="number"
  min="0"
  placeholder="Example: 10000"
>

<label>Tenure (Months)</label>
<input
  id="months"
  type="number"
  min="1"
  placeholder="Example: 24"
>

<div>

<button class="calc" onclick="calculateEMI()">
Calculate
</button>

<button
  class="reset"
  onclick="resetBox('emiBox',['loan','emi','months'])">
Reset
</button>

</div>

<div id="emiBox"></div>

</div>


<!-- REVERSE EMI -->

<div class="card">

<h2>Reverse EMI Calculator</h2>

<div class="small">
Enter EMI, interest rate and tenure to estimate the eligible loan amount.
</div>

<label>Monthly EMI (₹)</label>

<input
  id="rEmi"
  type="number"
  min="0"
  placeholder="Example: 10000"
>

<label>Annual Interest Rate (%)</label>

<input
  id="rate"
  type="number"
  min="0"
  step="0.01"
  placeholder="Example: 12"
>

<label>Tenure (Months)</label>

<input
  id="rMonths"
  type="number"
  min="1"
  placeholder="Example: 24"
>

<div>

<button class="calc" onclick="reverseEMI()">
Calculate
</button>

<button
  class="reset"
  onclick="resetBox('reverseBox',['rEmi','rate','rMonths'])">
Reset
</button>

</div>

<div id="reverseBox"></div>

</div>


<!-- FD CALCULATOR -->

<div class="card">

<h2>Deposit / FD Calculator</h2>

<label>Deposit Amount (₹)</label>

<input
  id="fdAmount"
  type="number"
  min="0"
  placeholder="Example: 100000"
>

<label>Annual Interest Rate (%)</label>

<input
  id="fdRate"
  type="number"
  min="0"
  step="0.01"
  placeholder="Example: 7"
>

<label>Years</label>

<input
  id="fdYears"
  type="number"
  min="0"
  step="0.1"
  placeholder="Example: 2"
>

<div>

<button class="calc" onclick="fdCalc()">
Calculate
</button>

<button
  class="reset"
  onclick="resetBox('fdBox',['fdAmount','fdRate','fdYears'])">
Reset
</button>

</div>

<div id="fdBox"></div>

</div>

</div>


<script>

const money = n => new Intl.NumberFormat('en-IN',{
  style:'currency',
  currency:'INR',
  maximumFractionDigits:2
}).format(n);

const num = id =>
  parseFloat(document.getElementById(id).value);


// EMI CALCULATION

function calculateEMI(){

  const P = num('loan');
  const E = num('emi');
  const n = num('months');

  if(!(P>0)||!(E>0)||!(n>0)){

    msg(
      'emiBox',
      'Please enter Loan Amount, Monthly EMI and Tenure.'
    );

    return;
  }

  const total = E * n;

  const interest = total - P;

  const monthlyRate =
    findMonthlyRate(P,E,n);

  const annual =
    monthlyRate * 12 * 100;

  const flat =
    interest / (P*n) * 1200;

  // Monthly interest amount
  const monthlyInterest =
    interest / n;


  document.getElementById('emiBox').innerHTML = `

    <div class="result">

      <div class="row">

        <div>
          Total Payment<br>
          <span class="value">
            ${money(total)}
          </span>
        </div>

        <div>
          Total Interest<br>
          <span class="value">
            ${money(interest)}
          </span>
        </div>

        <div>
          Monthly Interest<br>
          <span class="value">
            ${money(monthlyInterest)}
          </span>
        </div>

        <div>
          Reducing ROI (approx.)<br>
          <span class="value">
            ${annual.toFixed(2)}% p.a.
          </span>
        </div>

        <div>
          Flat Rate (approx.)<br>
          <span class="value">
            ${flat.toFixed(2)}% p.a.
          </span>
        </div>

      </div>

    </div>

  `;

}


// FIND INTEREST RATE

function findMonthlyRate(P,E,n){

  let lo = 0;
  let hi = 1;

  for(let i=0;i<100;i++){

    let r = (lo + hi) / 2;

    let v =
      r === 0
      ? P / n
      : P * r * Math.pow(1+r,n) /
        (Math.pow(1+r,n)-1);

    if(v > E)
      hi = r;
    else
      lo = r;
  }

  return (lo + hi) / 2;
}


// REVERSE EMI

function reverseEMI(){

  const E = num('rEmi');
  const annual = num('rate');
  const n = num('rMonths');

  if(
    !(E>0) ||
    annual < 0 ||
    !(n>0)
  ){

    msg(
      'reverseBox',
      'Please enter EMI, Interest Rate and Tenure.'
    );

    return;
  }

  const r =
    annual / 100 / 12;

  const P =
    r === 0
    ? E * n
    : E * (1-Math.pow(1+r,-n)) / r;

  const total =
    E * n;

  const interest =
    total - P;

  const monthlyInterest =
    interest / n;


  document.getElementById('reverseBox').innerHTML = `

    <div class="result">

      <div class="row">

        <div>
          Estimated Loan Amount<br>
          <span class="value">
            ${money(P)}
          </span>
        </div>

        <div>
          Total Payment<br>
          <span class="value">
            ${money(total)}
          </span>
        </div>

        <div>
          Total Interest<br>
          <span class="value">
            ${money(interest)}
          </span>
        </div>

        <div>
          Monthly Interest<br>
          <span class="value">
            ${money(monthlyInterest)}
          </span>
        </div>

        <div>
          Interest Rate<br>
          <span class="value">
            ${annual.toFixed(2)}% p.a.
          </span>
        </div>

      </div>

    </div>

  `;

}


// FD CALCULATOR

function fdCalc(){

  const P = num('fdAmount');
  const r = num('fdRate');
  const y = num('fdYears');

  if(
    !(P>0) ||
    r < 0 ||
    !(y>0)
  ){

    msg(
      'fdBox',
      'Please enter Deposit Amount, Interest Rate and Years.'
    );

    return;
  }

  const interest =
    P * r * y / 100;

  const maturity =
    P + interest;


  document.getElementById('fdBox').innerHTML = `

    <div class="result">

      <div class="row">

        <div>
          Interest Amount<br>
          <span class="value">
            ${money(interest)}
          </span>
        </div>

        <div>
          Maturity Amount<br>
          <span class="value">
            ${money(maturity)}
          </span>
        </div>

      </div>

      <p class="small">
        Simple-interest estimate.
      </p>

    </div>

  `;

}


// MESSAGE

function msg(id,t){

  document.getElementById(id).innerHTML =
    '<div class="result">'+t+'</div>';

}


// RESET

function resetBox(box,ids){

  ids.forEach(id =>
    document.getElementById(id).value=''
  );

  document.getElementById(box).innerHTML='';

}

</script>

</body>
</html>
