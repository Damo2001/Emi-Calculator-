<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Calculator</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f8fb;
  color:#17324d;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

h1{
  text-align:center;
  color:#0b5cab;
  margin:8px 0 4px;
}

.sub{
  text-align:center;
  color:#607d8b;
  margin-bottom:20px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin:16px 0;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  color:#087f5b;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid #c9d6df;
  border-radius:10px;
  font-size:17px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin:10px 6px 0 0;
}

.calc{
  background:#0b7a5a;
  color:#fff;
}

.reset{
  background:#607d8b;
  color:#fff;
}

.result{
  background:#eef8f4;
  border-left:5px solid #087f5b;
  padding:15px;
  border-radius:10px;
  margin-top:18px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.value{
  font-size:21px;
  font-weight:bold;
  color:#0b5cab;
}

.small{
  font-size:13px;
  color:#607d8b;
}

@media(max-width:600px){
  .row{
    grid-template-columns:1fr;
  }

  .container{
    padding:10px;
  }

  .card{
    padding:16px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>Finance Calculator</h1>

<div class="sub">
  EMI • Reverse EMI • Interest Calculator
</div>


<!-- EMI CALCULATOR -->

<div class="card">

<h2>EMI Calculator</h2>

<label>Loan Amount (₹)</label>

<input
  id="loan"
  type="number"
  min="0"
  placeholder="Example: 200000"
>

<label>Monthly EMI (₹)</label>

<input
  id="emi"
  type="number"
  min="0"
  placeholder="Example: 10000"
>

<label>Tenure (Months)</label>

<input
  id="months"
  type="number"
  min="1"
  placeholder="Example: 24"
>

<div>

<button class="calc" onclick="calculateEMI()">
Calculate
</button>

  class="reset
